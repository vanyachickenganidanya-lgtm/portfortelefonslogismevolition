name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  sim:
    name: Funo simulator (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test + release sim
        run: |
          cargo test -p logismevo_sim --verbose
          cargo build -p logismevo_sim --release

  phone:
    name: Bevy + Slint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libasound2-dev libudev-dev libfontconfig1-dev libclang-dev
      - name: Release phone app
        run: cargo build -p logismevo-phone --release
      - name: Upload Linux
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-linux
          path: target/release/logismevo-phone
      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-windows
          path: target/release/logismevo-phone.exe
      - name: Upload macOS
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-macos
          path: target/release/logismevo-phone

  web:
    name: Phone web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack web + Funo components
        run: |
          mkdir -p dist/funo/components
          cp -r web/* dist/
          cp funo/components/*.fun dist/funo/components/
      - uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-web
          path: dist

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Pack web assets + assemble debug APK
        run: |
          chmod +x android/pack-assets.sh
          ./android/pack-assets.sh
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
          gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
