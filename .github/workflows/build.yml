name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  sim:
    name: Funo simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test interpreter + circuit
        run: cargo test -p logismevo_sim --verbose
      - name: Release sim lib
        run: cargo build -p logismevo_sim --release

  phone-linux:
    name: Bevy + Slint (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native deps (Slint + Bevy)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev \
            libfontconfig1-dev \
            libclang-dev
      - name: Release phone app
        run: cargo build -p logismevo-phone --release
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-linux
          path: target/release/logismevo-phone

  web:
    name: Phone web preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack web + Funo components
        run: |
          mkdir -p dist
          cp -r web/* dist/
          mkdir -p dist/funo/components
          cp funo/components/*.fun dist/funo/components/
      - uses: actions/upload-artifact@v4
        with:
          name: logismevo-phone-web
          path: dist
